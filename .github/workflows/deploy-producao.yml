name: Deploy Produção Sistema de Gestão

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-sistema-de-gestao
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    env:
      KUBECONFIG: /home/github-runner/.kube/config

      NAMESPACE: apps

      BACKEND_DEPLOYMENT: gestao-backend
      FRONTEND_DEPLOYMENT: gestao-frontend

      BACKEND_CONTAINER: gestao-backend
      FRONTEND_CONTAINER: gestao-frontend

      BACKEND_IMAGE: ghcr.io/nicrepository/gestao-backend
      FRONTEND_IMAGE: ghcr.io/nicrepository/gestao-frontend

      IMAGE_TAG: sha-${{ github.sha }}

      BACKEND_DOCKERFILE: ./backend/Dockerfile
      BACKEND_CONTEXT: ./backend

      FRONTEND_DOCKERFILE: ./frontend/Dockerfile
      FRONTEND_CONTEXT: ./frontend

      VITE_API_URL: /api

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar estrutura do projeto
        run: |
          set -euo pipefail

          echo "Workspace: $GITHUB_WORKSPACE"
          pwd

          test -f "$BACKEND_DOCKERFILE" || {
            echo "ERRO: Backend Dockerfile não encontrado em $BACKEND_DOCKERFILE"
            exit 1
          }

          test -f "$FRONTEND_DOCKERFILE" || {
            echo "ERRO: Frontend Dockerfile não encontrado em $FRONTEND_DOCKERFILE"
            exit 1
          }

          test -f backend/package.json || {
            echo "ERRO: backend/package.json não encontrado"
            exit 1
          }

          test -f frontend/package.json || {
            echo "ERRO: frontend/package.json não encontrado"
            exit 1
          }

          echo "Estrutura OK"

      - name: Validar acesso ao Kubernetes
        run: |
          set -euo pipefail

          kubectl get deployment "$BACKEND_DEPLOYMENT" -n "$NAMESPACE"
          kubectl get deployment "$FRONTEND_DEPLOYMENT" -n "$NAMESPACE"

      - name: Login no GHCR
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.GHCR_USER }}" ]; then
            echo "ERRO: secret GHCR_USER não configurado"
            exit 1
          fi

          if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "ERRO: secret GHCR_TOKEN não configurado"
            exit 1
          fi

          printf '%s' "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USER }}" \
            --password-stdin

      - name: Limpar cache do Docker builder
        run: |
          docker builder prune --all --force
          docker system prune -f --volumes || true

      - name: Build backend
        run: |
          set -euo pipefail

          docker build \
            -t "$BACKEND_IMAGE:$IMAGE_TAG" \
            -t "$BACKEND_IMAGE:latest" \
            -f "$BACKEND_DOCKERFILE" \
            "$BACKEND_CONTEXT"

      - name: Build frontend
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "ERRO: secret VITE_SUPABASE_URL não configurado"
            echo "Acesse: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "ERRO: secret VITE_SUPABASE_ANON_KEY não configurado"
            echo "Acesse: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -t "$FRONTEND_IMAGE:$IMAGE_TAG" \
            -t "$FRONTEND_IMAGE:latest" \
            -f "$FRONTEND_DOCKERFILE" \
            "$FRONTEND_CONTEXT"

      - name: Push imagens
        run: |
          set -euo pipefail

          docker push "$BACKEND_IMAGE:$IMAGE_TAG"
          docker push "$BACKEND_IMAGE:latest"

          docker push "$FRONTEND_IMAGE:$IMAGE_TAG"
          docker push "$FRONTEND_IMAGE:latest"

      - name: Deploy no Kubernetes
        run: |
          set -euo pipefail

          kubectl set image deployment/"$BACKEND_DEPLOYMENT" \
            "$BACKEND_CONTAINER=$BACKEND_IMAGE:$IMAGE_TAG" \
            -n "$NAMESPACE"

          kubectl set image deployment/"$FRONTEND_DEPLOYMENT" \
            "$FRONTEND_CONTAINER=$FRONTEND_IMAGE:$IMAGE_TAG" \
            -n "$NAMESPACE"

          kubectl rollout status deployment/"$BACKEND_DEPLOYMENT" \
            -n "$NAMESPACE" \
            --timeout=300s

          kubectl rollout status deployment/"$FRONTEND_DEPLOYMENT" \
            -n "$NAMESPACE" \
            --timeout=180s

      - name: Validar pods e serviços
        run: |
          set -euo pipefail

          kubectl get pods -n "$NAMESPACE" | grep -E "gestao-backend|gestao-frontend"
          kubectl get svc -n "$NAMESPACE" | grep -E "gestao-backend|gestao-frontend"

      - name: Mostrar imagens implantadas
        run: |
          set -euo pipefail

          kubectl get deployment "$BACKEND_DEPLOYMENT" -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}'

          kubectl get deployment "$FRONTEND_DEPLOYMENT" -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}'

      - name: Limpar lixo do Docker
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f
